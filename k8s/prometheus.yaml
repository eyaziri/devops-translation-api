apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: translation-app
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    
    scrape_configs:
      - job_name: 'translation-api'
        static_configs:
          - targets: ['translation-service:5001']
        metrics_path: '/metrics/prometheus'
        scrape_interval: 10s