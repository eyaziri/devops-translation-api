name: CI/CD Pipeline for Translation API

on:
  push:
    branches: [ main, feature/translation-api ]
  pull_request:
    branches: [ main ]

jobs:
  # JOB 1: Tests de l'application
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest requests
      
      - name: Run unit tests
        run: |
          python -m pytest tests/ -v
      
      - name: Start API for endpoint testing
        run: |
          python api.py &
          sleep 5
          echo "🔄 API starting..."
      
      - name: Test health endpoint
        run: |
          curl -f http://localhost:5001/health || exit 1
          echo "✅ Health endpoint OK"
      
      - name: Test translate endpoint
        run: |
          response=$(curl -s -X POST http://localhost:5001/translate \
            -H "Content-Type: application/json" \
            -d '{"text": "hello world", "target_lang": "fr"}')
          echo $response | grep -q "translated_text" || exit 1
          echo "✅ Translate endpoint OK"

  # JOB 2: Sécurité SAST
  security-sast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: SAST with Bandit
        run: |
          pip install bandit
          bandit -r . -f json -o bandit-report.json || true
          bandit -r . -f html -o bandit-report.html || true
      
      - name: Upload SAST reports
        uses: actions/upload-artifact@v3
        with:
          name: sast-reports
          path: |
            bandit-report.json
            bandit-report.html

  # JOB 3: Build et test Docker
  build-docker:
    runs-on: ubuntu-latest
    needs: [test, security-sast]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Build Docker image
        run: |
          docker build -t translation-api:latest .
      
      - name: Test Docker image
        run: |
          docker run -d -p 5001:5001 --name api-test translation-api:latest
          sleep 10
          curl -f http://localhost:5001/health
          docker logs api-test
          docker stop api-test

  # JOB 4: Sécurité DAST
  security-dast:
    runs-on: ubuntu-latest
    needs: build-docker
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Start API container for DAST
        run: |
          docker run -d -p 5001:5001 --name api-dast translation-api:latest
          echo "🔄 Waiting for API to start..."
          sleep 15
      
      - name: Run OWASP ZAP scan
        run: |
          docker run -v $(pwd):/zap/wrk/:rw -t owasp/zap2docker-stable zap-baseline.py \
            -t http://host.docker.internal:5001/ \
            -g gen.conf \
            -r zap-report.html \
            -w zap-report.md || true
      
      - name: Upload DAST reports
        uses: actions/upload-artifact@v3
        with:
          name: dast-reports
          path: |
            zap-report.html
            zap-report.md
      
      - name: Cleanup
        run: |
          docker stop api-dast || true
          docker rm api-dast || true

  # JOB 5: Déploiement Kubernetes
  deploy-kubernetes:
    runs-on: ubuntu-latest
    needs: [build-docker, security-dast]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Minikube
        run: |
          curl -LO https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
          sudo install minikube-linux-amd64 /usr/local/bin/minikube
          minikube start --driver=docker
      
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/
          echo "🔄 Waiting for deployment..."
          sleep 30
      
      - name: Verify deployment
        run: |
          kubectl get pods -n translation-app
          kubectl get services -n translation-app
          kubectl logs -n translation-app deployment/translation-api
      
      - name: Collect deployment evidence
        run: |
          kubectl get all -n translation-app > k8s-status.txt
          kubectl describe deployment translation-api -n translation-app > deployment-describe.txt
          echo "📊 Deployment evidence collected"

  # JOB 6: Observability Capture
  observability-capture:
    runs-on: ubuntu-latest
    needs: deploy-kubernetes
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Capture metrics and logs
        run: |
          kubectl get pods -n translation-app -o wide > observability-pods.txt
          kubectl top pods -n translation-app > observability-resources.txt
          echo "📈 Observability data captured"

  # JOB 7: Push to Docker Hub
  push-dockerhub:
    runs-on: ubuntu-latest
    needs: [test, security-sast, build-docker]
    
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/translation-api:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/translation-api:latest
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/translation-api:latest ${{ secrets.DOCKERHUB_USERNAME }}/translation-api:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/translation-api:${{ github.sha }}

  # JOB 8: Génération du rapport final
  final-report:
    runs-on: ubuntu-latest
    needs: [test, security-sast, build-docker, security-dast, deploy-kubernetes, push-dockerhub]
    
    steps:
      - name: Generate final report
        run: |
          cat > final-report.md << EOF
          # Rapport d'exécution du Pipeline CI/CD
          ## Résumé - $(date)
          
          ### Jobs exécutés:
          - ✅ Tests: ${{ needs.test.result }}
          - ✅ SAST Security: ${{ needs.security-sast.result }}
          - ✅ Build Docker: ${{ needs.build-docker.result }}
          - ✅ DAST Security: ${{ needs.security-dast.result }}
          - ✅ Déploiement Kubernetes: ${{ needs.deploy-kubernetes.result }}
          - ✅ Push Docker Hub: ${{ needs.push-dockerhub.result }}
          
          ### Artefacts générés:
          - Rapports SAST (Bandit)
          - Rapports DAST (OWASP ZAP)
          - Images Docker
          - Preuves de déploiement Kubernetes
          
          ### Image Docker:
          - Nom: ${{ secrets.DOCKERHUB_USERNAME }}/translation-api
          - Tags: latest, ${{ github.sha }}
          
          ### Statut global: ✅ SUCCÈS
          EOF
      
      - name: Upload final report
        uses: actions/upload-artifact@v3
        with:
          name: final-report
          path: final-report.md