# ZAP Configuration for Translation API
# Exclude false positives and known non-issues

# Exclude health endpoint from active scan
exclude=.*/health.*

# Exclude metrics endpoints
exclude=.*/metrics.*

# Scanner specific configurations
scanner.threadPerHost=10
scanner.maxRuleDurationInMins=5

# Passive scan rules to enable
pscanrules.10010.enabled=true  # Cookie set without HttpOnly flag
pscanrules.10015.enabled=true  # Incomplete or no cache-control header
pscanrules.10054.enabled=true  # Cross-Domain Misconfiguration
pscanrules.10055.enabled=true  # Cookie set without SameSite attribute

# Active scan rules to enable
ascanrules.40012.enabled=true  # Cross Site Scripting
ascanrules.40013.enabled=true  # SQL Injection
ascanrules.40014.enabled=true  # Buffer Overflow
ascanrules.40016.enabled=true  # Server Side Include
ascanrules.40017.enabled=true  # OS Command Injection